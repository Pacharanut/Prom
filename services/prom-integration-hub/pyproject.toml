[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prom-integration-hub"
version = "0.1.0"
description = "Prom Integration Hub — LINE/Discord integration for Prom (Plane-based project management)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
    "celery[redis]>=5.4,<6",
    "cryptography>=42,<46",
    "discord.py>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "import-linter>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Hand-written Alembic migrations mirror op.create_table column-by-column; wrapping every
# sa.Column(...) call to fit 100 chars hurts readability more than it helps. mypy excludes
# migrations/ for the same reason (see [tool.mypy] below).
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]

# celery ships no py.typed marker / stubs; this is a known gap, not a project type-safety issue.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real Postgres + Redis (docker compose); excluded by default, run with -m integration",
]
addopts = "-m 'not integration'"

[tool.importlinter]
root_packages = ["src", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["src.domain", "src.application"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "httpx", "requests", "aiohttp",
    "redis", "celery", "discord", "linebot", "boto3",
]

[[tool.importlinter.contracts]]
name = "Dependency direction: channels -> application -> domain"
type = "layers"
layers = [
    "src.channels",
    "src.application",
    "src.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on adapters/infrastructure"
type = "forbidden"
source_modules = ["src.domain", "src.application"]
forbidden_modules = ["src.adapters", "src.infrastructure", "src.channels"]

# Prom vhosts for the HOST nginx on adminmc (the one already serving taco.ntaisolution.com).
# A separate file: install as /etc/nginx/sites-available/prom.ntaisolution.com and symlink into
# sites-enabled. It does not change the taco file. Test with `sudo nginx -t` before
# `sudo systemctl reload nginx`.
#
# Uses the existing *.ntaisolution.com wildcard cert (expires 2026-12-27; renewed by its owner).
# If PROM_DOMAIN / PROM_HUB_DOMAIN in server.env change, change server_name here too.

# ---------- Plane (web app) ----------
server {
    listen 80;
    server_name prom.ntaisolution.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name prom.ntaisolution.com;

    ssl_certificate     /home/dom/ntaisolution.com/ntaisolution.com.cert;
    ssl_certificate_key /home/dom/ntaisolution.com/ntaisolution.com.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# ---------- Prom Integration Hub ----------
server {
    listen 80;
    server_name prom-hub.ntaisolution.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name prom-hub.ntaisolution.com;

    ssl_certificate     /home/dom/ntaisolution.com/ntaisolution.com.cert;
    ssl_certificate_key /home/dom/ntaisolution.com/ntaisolution.com.key;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Public: LINE and Plane webhooks (each has its own HMAC signature check).
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # Health checks from this machine only. The Hub's /api/v1 is never published here:
    # Plane's api reaches it directly over the prom-net Docker network.
    location ~ ^/(healthz|readyz)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        return 404;
    }
}

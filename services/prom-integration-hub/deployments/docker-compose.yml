x-service-network-env: &service-network-env
  # These override .env's host-oriented values (localhost:...) so that api/worker/beat/discord-bot
  # — which run as containers on this compose network — reach postgres/redis by service name
  # instead of localhost. .env's localhost URLs are for running those same processes natively on
  # the host (see README's "Run" section), where they connect via the published host ports below.
  DATABASE_URL: postgresql+asyncpg://prom:prom@postgres:5432/prom_hub
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

x-trust-local-tls: &trust-local-tls
  # Local-dev-only: trusts docs/operations/local-dev-testing.md's self-signed TLS proxy cert (see
  # its "gotcha #5") by appending it to certifi's bundle before starting the real process --
  # baked in here so it survives every image rebuild/container recreate, instead of a manual
  # `docker cp` + `docker exec ... cat >> certifi...` step after each one (repeatedly forgotten in
  # practice, most recently causing every Discord bot action needing Plane's API to silently fail
  # with SSL: CERTIFICATE_VERIFY_FAILED after a redeploy). No-ops safely if the cert isn't mounted
  # (i.e. deployments outside this local setup) — a missing file at /certs/cert.pem is just skipped.
  volumes:
    - ../../../local-tls/cert.pem:/certs/local-tls-ca.pem:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prom
      POSTGRES_PASSWORD: prom
      POSTGRES_DB: prom_hub
    ports:
      # Host port 55432, not the default 5432: this machine already has something bound to 5432.
      # Internal container-to-container traffic (api/worker/beat -> postgres) is unaffected, since
      # compose services reach each other by service name on the container's internal port 5432.
      - "55432:5432"
    volumes:
      - hub_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380, not the default 6379: Plane's own docker-compose-local.yml publishes its
      # plane-redis container on 6379, and both stacks need to run at once for real end-to-end
      # testing of the Django relay -> Hub path.
      - "6380:6379"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    <<: *trust-local-tls
    entrypoint: >
      bash -c '[ -f /certs/local-tls-ca.pem ] && cat /certs/local-tls-ca.pem >> $$(python3 -c "import certifi; print(certifi.where())");
      exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000'
    depends_on:
      - postgres
      - redis
    ports:
      # Host port 8001, not the default 8000: Plane's own docker-compose-local.yml publishes its
      # Django api container on 8000. PROM_HUB_BASE_URL in plane's apps/api/.env must point here.
      - "8001:8000"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    <<: *trust-local-tls
    entrypoint: >
      bash -c '[ -f /certs/local-tls-ca.pem ] && cat /certs/local-tls-ca.pem >> $$(python3 -c "import certifi; print(certifi.where())");
      exec celery -A apps.worker.main.celery_app worker --loglevel=info'
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    <<: *trust-local-tls
    entrypoint: >
      bash -c '[ -f /certs/local-tls-ca.pem ] && cat /certs/local-tls-ca.pem >> $$(python3 -c "import certifi; print(certifi.where())");
      exec celery -A apps.scheduler.main.celery_app beat --loglevel=info'
    depends_on:
      - postgres
      - redis

  discord-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    <<: *trust-local-tls
    entrypoint: >
      bash -c '[ -f /certs/local-tls-ca.pem ] && cat /certs/local-tls-ca.pem >> $$(python3 -c "import certifi; print(certifi.where())");
      exec python -m apps.discord_bot.main'
    depends_on:
      - postgres
      - redis
    # No installation-change hot-reload (Gate 6 known limitation) — restart this service after
    # creating/activating/revoking a Discord installation for it to take effect.
    restart: unless-stopped

volumes:
  hub_pgdata:

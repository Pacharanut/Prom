x-service-network-env: &service-network-env
  # These override .env's host-oriented values (localhost:...) so that api/worker/beat/discord-bot
  # — which run as containers on this compose network — reach postgres/redis by service name
  # instead of localhost. .env's localhost URLs are for running those same processes natively on
  # the host (see README's "Run" section), where they connect via the published host ports below.
  DATABASE_URL: postgresql+asyncpg://prom:prom@postgres:5432/prom_hub
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prom
      POSTGRES_PASSWORD: prom
      POSTGRES_DB: prom_hub
    ports:
      # Host port 55432, not the default 5432: this machine already has something bound to 5432.
      # Internal container-to-container traffic (api/worker/beat -> postgres) is unaffected, since
      # compose services reach each other by service name on the container's internal port 5432.
      - "55432:5432"
    volumes:
      - hub_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380, not the default 6379: Plane's own docker-compose-local.yml publishes its
      # plane-redis container on 6379, and both stacks need to run at once for real end-to-end
      # testing of the Django relay -> Hub path.
      - "6380:6379"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    depends_on:
      - postgres
      - redis
    ports:
      # Host port 8001, not the default 8000: Plane's own docker-compose-local.yml publishes its
      # Django api container on 8000. PROM_HUB_BASE_URL in plane's apps/api/.env must point here.
      - "8001:8000"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "apps.worker.main.celery_app", "worker", "--loglevel=info"]
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "apps.scheduler.main.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    depends_on:
      - postgres
      - redis

  discord-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.discord_bot.main"]
    env_file:
      - ../.env
    environment:
      <<: *service-network-env
    depends_on:
      - postgres
      - redis
    # No installation-change hot-reload (Gate 6 known limitation) — restart this service after
    # creating/activating/revoking a Discord installation for it to take effect.
    restart: unless-stopped

volumes:
  hub_pgdata:

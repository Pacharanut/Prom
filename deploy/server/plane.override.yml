# Server override for plane/docker-compose.yml on the SHARED Docker host.
# Always used through deploy/server/prom.sh, never directly.
#
# - Own project name (prom-plane) so volumes/networks never mix with other people's stacks.
# - Every container_name gets a prom-plane- prefix (upstream uses generic names like "web", "api").
# - Only the proxy publishes a port, and only on 127.0.0.1.
# - Only `api` joins the shared prom-net network, to call the Hub's API (prom-hub-api:8000)
#   without going through the internet. Nothing on prom-net looks up the bare names of the
#   other stack's services, so the duplicate "api" service name there is harmless.
name: prom-plane

services:
  web:
    container_name: prom-plane-web
  admin:
    container_name: prom-plane-admin
  space:
    container_name: prom-plane-space
  api:
    container_name: prom-plane-api
    networks: [default, prom-net]
  worker:
    container_name: prom-plane-bgworker
  beat-worker:
    container_name: prom-plane-beatworker
  migrator:
    container_name: prom-plane-migrator
  live:
    container_name: prom-plane-live
  plane-db:
    container_name: prom-plane-db
  plane-redis:
    container_name: prom-plane-redis
  plane-mq:
    container_name: prom-plane-mq
  plane-minio:
    container_name: prom-plane-minio
  proxy:
    container_name: prom-plane-proxy
    ports: !override
      - "127.0.0.1:${PROM_PLANE_HTTP_PORT}:80"
    environment:
      SITE_ADDRESS: ":80"

networks:
  prom-net:
    external: true
